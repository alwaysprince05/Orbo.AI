    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Orbo AI - Beauty AI Solutions for Brands | Virtual Makeup, Skin Analysis & BeautyGPT</title>
    <meta name="description" content="Boost CX with Orbo's Beauty AI: Virtual Makeup Try-On, Hair Color & Styling, Skin Analysis & Facial Enhancements - online and in-store beauty tech." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@300;400;500;600;700;800;900&family=Lato:wght@400;700;900&display=swap" rel="stylesheet">
  </head>
  <body>
    <style>html, body { overflow: hidden !important; position: fixed !important; width: 100% !important; }</style>
    <script>
      // Aggressively prevent browser scroll restoration on refresh
      (function() {
        function forceScrollTop() {
          window.scrollTo(0, 0);
          document.documentElement.scrollTop = 0;
          document.body.scrollTop = 0;
        }
        // Disable browser scroll restoration
        if ('scrollRestoration' in history) {
          history.scrollRestoration = 'manual';
        }
        // Lock scroll immediately
        forceScrollTop();
        // bfcache restore
        window.addEventListener('pageshow', function(e) {
          forceScrollTop();
          if (e.persisted) {
            requestAnimationFrame(forceScrollTop);
            setTimeout(forceScrollTop, 100);
            setTimeout(forceScrollTop, 300);
            setTimeout(forceScrollTop, 600);
          }
        });
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
